services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: orderhub
      MYSQL_USER: orderhub
      MYSQL_PASSWORD: orderhub
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uorderhub", "-porderhub"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    environment:
      DB_URL: jdbc:mysql://mysql:3306/orderhub
      DB_USERNAME: orderhub
      DB_PASSWORD: orderhub
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
