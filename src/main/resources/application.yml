spring:
  application:
    name: marketplace-order-hub
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/orderhub}
    username: ${DB_USERNAME:orderhub}
    password: ${DB_PASSWORD:orderhub}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

orderhub:
  # Requests-per-minute limit of each marketplace (each channel's contract is in docs/marketplaces.md).
  rate-limit:
    requests-per-minute:
      alfashop: 60
      betamarket: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  # Error responses are documented per endpoint, not added to every endpoint from the exception handler.
  override-with-generic-response: false
  swagger-ui:
    path: /swagger-ui.html
