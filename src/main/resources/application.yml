spring:
  application:
    name: marketplace-order-hub
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/orderhub}
    username: ${DB_USERNAME:orderhub}
    password: ${DB_PASSWORD:orderhub}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

orderhub:
  # Limite de requisições por minuto de cada marketplace (contrato de cada canal em docs/marketplaces.md).
  rate-limit:
    requests-per-minute:
      alfashop: 60
      betamarket: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
